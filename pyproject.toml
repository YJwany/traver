[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-information-system"
version = "0.1.0"
description = "Fact-grounded AI travel information aggregation and planning system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  # Public-holiday data, bundled locally. MIT licensed, so it is free for any use
  # including commercial. This replaces a web API whose terms allowed free use
  # only for private/non-profit projects; see providers/free/holidays_provider.py.
  "holidays>=0.60,<1.0",
  # Authenticated encryption for the credential vault. A user's own third-party
  # API keys are the opposite of Traver's own bearer keys: Traver only ever needs
  # to *verify* its own keys, so those are stored as a one-way hash, but it must
  # *replay* a user's key to the upstream service, so those have to be
  # recoverable and are therefore encrypted with AES-256-GCM at rest.
  "cryptography>=43,<50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI reads `Depends(...)` from the signature default; that is the documented
# dependency-injection idiom, so B008 does not apply to route modules.
"apps/api/src/travel_api/api/routes.py" = ["B008"]
"apps/api/src/travel_api/api/dependencies.py" = ["B008"]
# Tests assert on provider/ORM failures whose concrete exception type is an
# implementation detail (sqlalchemy wraps driver errors), so a blind Exception is
# the honest assertion here.
"tests/integration/test_concurrency_and_limits.py" = ["B017"]
