name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: a push that replaces an in-flight run
# makes the older result irrelevant, and CI minutes are finite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Install from the lock file so CI resolves the same versions a
          # developer does; falling back to the loose spec would let a new
          # upstream release break CI without any code change.
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests
        env:
          PYTHONPATH: apps/api/src
        run: python -m pytest -q

  migrations:
    name: Migrations (upgrade/downgrade/upgrade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Alembic round trip
        env:
          PYTHONPATH: apps/api/src
          DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: No schema drift
        env:
          PYTHONPATH: apps/api/src
          DATABASE_URL: sqlite:///./ci-drift.db
        run: |
          # A migration that does not match the models is a latent production
          # failure: autogenerate must produce an empty revision.
          python -m alembic upgrade head
          python -m alembic revision --autogenerate -m "drift check"
          if grep -qE '^[[:space:]]+op\.' db/migrations/versions/*drift_check.py; then
            echo "Schema drift detected: models and migrations disagree."
            cat db/migrations/versions/*drift_check.py
            exit 1
          fi

  web:
    name: Web (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # `npm ci` requires the lock file to be in sync with package.json, so a
      # dependency added without committing the lock fails here rather than
      # silently resolving a different tree than a developer has.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: npm test
      - run: npx next build

      - name: No secret in the client bundle
        working-directory: apps/web
        run: |
          # `NEXT_PUBLIC_*` values are inlined into the client bundle at build
          # time, so putting an API key there would publish it to every visitor
          # while looking like configuration. The key is entered at runtime and
          # kept in localStorage instead (see apps/web/lib/auth.ts). This fails
          # the build if that ever regresses.
          if grep -rqE 'NEXT_PUBLIC_API_KEY|trv_[A-Za-z0-9_-]{16,}' .next/static; then
            echo "A credential appears in the client bundle:"
            grep -rlE 'NEXT_PUBLIC_API_KEY|trv_[A-Za-z0-9_-]{16,}' .next/static
            exit 1
          fi
          echo "No NEXT_PUBLIC_API_KEY and no literal trv_ key in .next/static"
